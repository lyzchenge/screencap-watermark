name: Build DMG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Clone original ScreenCapture
        run: git clone --depth 1 https://github.com/sadopc/ScreenCapture.git /tmp/original

      - name: Apply patches
        run: |
          cp ScreenCapture/Models/*.swift       /tmp/original/ScreenCapture/Models/
          cp ScreenCapture/Services/*.swift     /tmp/original/ScreenCapture/Services/
          cp -r ScreenCapture/Features/Preview/*   /tmp/original/ScreenCapture/Features/Preview/
          cp -r ScreenCapture/Features/Settings/*  /tmp/original/ScreenCapture/Features/Settings/
          cp ScreenCapture/Supporting\ Files/ScreenCapture.entitlements /tmp/original/ScreenCapture/Supporting\ Files/

      - name: Fix deployment target (26.0 → 15.0)
        run: |
          PBXPROJ=$(find /tmp/original -name "project.pbxproj" | head -1)
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 26\.0/MACOSX_DEPLOYMENT_TARGET = 15.0/g' "$PBXPROJ"
          # Also set CODE_SIGN_ENTITLEMENTS in pbxproj
          sed -i '' 's|CODE_SIGN_ENTITLEMENTS = "";|CODE_SIGN_ENTITLEMENTS = "ScreenCapture/Supporting Files/ScreenCapture.entitlements";|g' "$PBXPROJ"
          # If the above didn't match (field doesn't exist), add it to build settings
          if ! grep -q "CODE_SIGN_ENTITLEMENTS" "$PBXPROJ"; then
            # Add entitlements to Release build config
            perl -i -pe 's/(buildSettings\s*=\s*\{)/\1\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = "ScreenCapture\/Supporting Files\/ScreenCapture.entitlements";/' "$PBXPROJ"
          fi

      - name: Patch PreviewViewModel
        run: |
          PREVIEW_VM=$(find /tmp/original -name "PreviewViewModel.swift" | head -1)
          python3 patch_preview_vm.py "$PREVIEW_VM"

      - name: Chinese translation
        run: |
          python3 zh_patch.py /tmp/original/ScreenCapture

      - name: Build
        run: |
          XCPROJ=$(find /tmp/original -name "*.xcodeproj" -d 1 | head -1)
          xcodebuild \
            -project "$XCPROJ" \
            -scheme ScreenCapture \
            -configuration Release \
            -derivedDataPath /tmp/derived \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            OTHER_CODE_SIGN_FLAGS="--entitlements /tmp/original/ScreenCapture/Supporting Files/ScreenCapture.entitlements" \
            build

      - name: Package DMG
        run: |
          APP=$(find /tmp/derived -name "ScreenCapture.app" -type d | head -1)
          echo "App: $APP"
          mkdir -p /tmp/dmg
          cp -R "$APP" /tmp/dmg/
          ln -s /Applications /tmp/dmg/Applications
          hdiutil create \
            -volname "ScreenCapture" \
            -srcfolder /tmp/dmg \
            -ov -format UDZO \
            /tmp/ScreenCapture-Watermark.dmg
          ls -lh /tmp/ScreenCapture-Watermark.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCapture-Watermark
          path: /tmp/ScreenCapture-Watermark.dmg
