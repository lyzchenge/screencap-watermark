name: Build DMG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout patches
        uses: actions/checkout@v4

      - name: Clone original ScreenCapture
        run: git clone --depth 1 https://github.com/sadopc/ScreenCapture.git /tmp/original

      - name: Apply patches
        run: |
          cp ScreenCapture/Models/*.swift       /tmp/original/ScreenCapture/Models/
          cp ScreenCapture/Services/*.swift     /tmp/original/ScreenCapture/Services/
          cp -r ScreenCapture/Features/Preview/*   /tmp/original/ScreenCapture/Features/Preview/
          cp -r ScreenCapture/Features/Settings/*  /tmp/original/ScreenCapture/Features/Settings/

      - name: Patch PreviewViewModel
        run: |
          PREVIEW_VM=$(find /tmp/original -name "PreviewViewModel.swift" | head -1)
          python3 patch_preview_vm.py "$PREVIEW_VM"

      - name: Add new files to Xcode project
        run: |
          XCPROJ=$(find /tmp/original -name "*.xcodeproj" -d 1 | head -1)
          echo "Xcode project: $XCPROJ"
          sudo gem install xcodeproj --no-doc
          ruby -e '
          require "xcodeproj"
          p = Xcodeproj::Project.open(ARGV[0])
          t = p.targets.find { |t| t.is_a?(Xcodeproj::Project::Object::PBXNativeTarget) }
          abort "no target" unless t

          # Find groups by path
          def find_or_create_group(parent, subpath)
            names = subpath.split("/")
            current = parent
            names.each do |name|
              found = current.children.find { |c| c.respond_to?(:path) && c.path == name }
              unless found
                # Try PBXGroup methods
                found = current.children.find { |c| c.is_a?(Xcodeproj::Project::Object::PBXGroup) && (c.path == name || c.name == name) }
              end
              unless found
                # Check if this is a file system synchronized group — use groups instead
                if current.respond_to?(:groups)
                  found = current.groups.find { |g| g.path == name || g.name == name }
                end
              end
              unless found
                begin
                  found = current.new_group(name, name)
                rescue
                  # fallback: try to create in parent differently
                  found = p.new_group(name, name, current)
                end
              end
              current = found
            end
            current
          end

          # Find ScreenCapture group
          mg = p.main_group.children.find { |c| c.is_a?(Xcodeproj::Project::Object::PBXGroup) && (c.path == "ScreenCapture" || c.name == "ScreenCapture") }
          unless mg
            if p.main_group.respond_to?(:groups)
              mg = p.main_group.groups.find { |g| g.path == "ScreenCapture" || g.name == "ScreenCapture" }
            end
          end
          abort "no ScreenCapture group" unless mg

          # Find Models and Services sub-groups
          models_group = mg.children.find { |c| c.respond_to?(:path) && (c.path == "Models" || c.name == "Models") }
          models_group ||= mg.groups.find { |g| g.path == "Models" || g.name == "Models" } if mg.respond_to?(:groups)

          services_group = mg.children.find { |c| c.respond_to?(:path) && (c.path == "Services" || c.name == "Services") }
          services_group ||= mg.groups.find { |g| g.path == "Services" || g.name == "Services" } if mg.respond_to?(:groups)

          abort "no Models group" unless models_group
          abort "no Services group" unless services_group

          src_dir = ARGV[1]
          [
            [models_group, "ScreenCapture/Models/WatermarkConfig.swift"],
            [services_group, "ScreenCapture/Services/WatermarkRenderer.swift"],
          ].each do |g, path|
            fp = File.join(src_dir, path)
            next unless File.exist?(fp)
            next if t.source_build_phase.files.any? { |bf| bf.file_ref&.path&.include?(File.basename(path)) }
            ref = g.new_file(path)
            t.source_build_phase.add_file_reference(ref)
            puts "  added #{File.basename(path)}"
          end

          p.save
          puts "Xcode project saved"' "$XCPROJ" /tmp/original

      - name: Build
        run: |
          XCPROJ=$(find /tmp/original -name "*.xcodeproj" -d 1 | head -1)
          xcodebuild \
            -project "$XCPROJ" \
            -scheme ScreenCapture \
            -configuration Release \
            -derivedDataPath /tmp/derived \
            build 2>&1 | tail -40

      - name: Package DMG
        run: |
          APP=$(find /tmp/derived -name "ScreenCapture.app" -type d | head -1)
          echo "App: $APP"
          mkdir -p /tmp/dmg
          cp -R "$APP" /tmp/dmg/
          ln -s /Applications /tmp/dmg/Applications
          hdiutil create \
            -volname "ScreenCapture-Watermark" \
            -srcfolder /tmp/dmg \
            -ov -format UDZO \
            /tmp/ScreenCapture-Watermark.dmg
          ls -lh /tmp/ScreenCapture-Watermark.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCapture-Watermark
          path: /tmp/ScreenCapture-Watermark.dmg
